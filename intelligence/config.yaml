project:
  name: "operator-autopilot"

packs:
  intelligence-dev-packs:
    url: https://github.com/ainova-systems/intelligence-dev-packs.git
    ref: main

sources:
  rules:
    - "intelligence/rules"
    - "@intelligence-dev-packs/packs/core/rules"
    - "intelligence/sync/rules"
  agents:
    - "intelligence/agents"
    - "@intelligence-dev-packs/packs/core/agents"
    - "intelligence/sync/agents"
  skills:
    - "intelligence/skills"
    - "intelligence/sync/skills"
    - "@intelligence-dev-packs/packs/core/skills"

targets:
  claude:
    enabled: true
    output: ".claude"
  cursor:
    enabled: true
    output: ".cursor"
  codex:
    enabled: true
    output: ".codex"
  agents:
    enabled: true
    output: "AGENTS.md"

ignore:
  - "node_modules"
  - ".tmp"
  - "dist"
  - "coverage"
  - "state"
  - "intelligence/_backup"
  - "engine/content"
sync_version: "0.10.4"
