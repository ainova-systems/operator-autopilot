name: Tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['24', '26']
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Tests
        run: npm test
        env:
          # Live Ainoflow tests run when the secret is set; a fork's pull request has none and skips them.
          AINOFLOW_API_KEY: ${{ secrets.AINOFLOW_API_KEY }}

      - name: Pack and run the installed CLI
        run: npm run test:pack
