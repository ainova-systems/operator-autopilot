name: Release

# Publishes @ainova-systems/operator to npm and its container image to GHCR.
#
# Publishing a GitHub Release is the only release action. The release tag is the version and
# selects the channel:
#   vX.Y.Z-rc.N -> npm dist-tag `next`, image tag X.Y.Z-rc.N (GitHub prerelease required)
#   vX.Y.Z      -> npm `latest`, image tags X.Y.Z and latest
# The tag's base X.Y.Z must match package.json, and its commit must be on master.
# A pull request that changes this workflow, the Dockerfile or the package manifest runs the same
# build and smoke checks without publishing anything.
#
# Needs the NPM_TOKEN repository secret: a granular token with publish rights on the
# ainova-systems npm organisation. The image is pushed with the workflow's own token.

on:
  release:
    types: [published]
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - 'Dockerfile'
      - '.dockerignore'
      - 'package.json'
      - 'package-lock.json'

concurrency:
  group: release-${{ github.event.release.tag_name || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  npm:
    name: npm ${{ github.event.release.tag_name || 'dry run' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance
    outputs:
      version: ${{ steps.ver.outputs.version }}
      channel: ${{ steps.ver.outputs.channel }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name || github.sha }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Determine version
        id: ver
        env:
          EVENT: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          set -euo pipefail
          PACKAGE="$(node -p "require('./package.json').version")"
          if [ "$EVENT" != "release" ]; then
            echo "version=$PACKAGE" >> "$GITHUB_OUTPUT"
            echo "channel=none" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$RELEASE_TAG" =~ ^v([0-9]+[.][0-9]+[.][0-9]+)-rc[.]([1-9][0-9]*)$ ]]; then
            BASE="${BASH_REMATCH[1]}"
            VERSION="$BASE-rc.${BASH_REMATCH[2]}"
            CHANNEL="next"
            EXPECTED_PRERELEASE="true"
          elif [[ "$RELEASE_TAG" =~ ^v([0-9]+[.][0-9]+[.][0-9]+)$ ]]; then
            BASE="${BASH_REMATCH[1]}"
            VERSION="$BASE"
            CHANNEL="latest"
            EXPECTED_PRERELEASE="false"
          else
            echo "release tag must be vX.Y.Z or vX.Y.Z-rc.N (got '$RELEASE_TAG')" >&2
            exit 1
          fi
          [ "$BASE" = "$PACKAGE" ] || {
            echo "release base $BASE does not match package.json $PACKAGE" >&2
            exit 1
          }
          [ "$RELEASE_PRERELEASE" = "$EXPECTED_PRERELEASE" ] || {
            echo "release prerelease=$RELEASE_PRERELEASE does not match tag '$RELEASE_TAG'" >&2
            exit 1
          }
          git fetch --no-tags origin master
          git merge-base --is-ancestor HEAD FETCH_HEAD || {
            echo "release tag '$RELEASE_TAG' is not on master" >&2
            exit 1
          }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Set the release version
        run: npm version --no-git-tag-version --allow-same-version "${{ steps.ver.outputs.version }}"

      - name: Pack and run the installed CLI
        run: npm run test:pack

      - name: Publish
        if: github.event_name == 'release'
        run: npm publish --provenance --access public --tag "${{ steps.ver.outputs.channel }}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  image:
    name: image ${{ needs.npm.outputs.version }}
    needs: npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set the release version
        run: npm version --no-git-tag-version --allow-same-version "${{ needs.npm.outputs.version }}"

      - name: Build
        id: image
        env:
          REPO: ${{ github.repository }}
          VERSION: ${{ needs.npm.outputs.version }}
          SOURCE: ${{ github.server_url }}/${{ github.repository }}
        run: |
          set -euo pipefail
          NAME="ghcr.io/${REPO,,}/operator"
          docker build \
            --label "org.opencontainers.image.source=$SOURCE" \
            --label "org.opencontainers.image.version=$VERSION" \
            --label "org.opencontainers.image.licenses=MIT" \
            --label "org.opencontainers.image.description=Operator runtime" \
            -t "$NAME:$VERSION" .
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Smoke the image
        env:
          IMAGE: ${{ steps.image.outputs.name }}:${{ needs.npm.outputs.version }}
          VERSION: ${{ needs.npm.outputs.version }}
        run: |
          set -euo pipefail
          [ "$(docker run --rm "$IMAGE" --version)" = "$VERSION" ] || {
            echo "the image does not report version $VERSION" >&2
            exit 1
          }

      - name: Log in to GHCR
        if: github.event_name == 'release'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        if: github.event_name == 'release'
        env:
          NAME: ${{ steps.image.outputs.name }}
          VERSION: ${{ needs.npm.outputs.version }}
          CHANNEL: ${{ needs.npm.outputs.channel }}
        run: |
          set -euo pipefail
          docker push "$NAME:$VERSION"
          if [ "$CHANNEL" = "latest" ]; then
            docker tag "$NAME:$VERSION" "$NAME:latest"
            docker push "$NAME:latest"
          fi
